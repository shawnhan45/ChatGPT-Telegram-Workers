name: Deploy reviewed chatbot commit

on:
  push:
    branches: [master]
  workflow_dispatch:

# 同一时间只允许一个生产部署，新的部署会取消仍在排队的旧部署。
concurrency:
  group: chatbot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Prepare Wrangler config
        shell: bash
        run: |
          cp wrangler-example.toml wrangler.toml
          sed -i "s|name = 'chatgpt-telegram-workers'|name = '${{ secrets.WRANGLER_WORKER_NAME }}'|" wrangler.toml
          sed -i "s|id = ''|id = '${{ secrets.WRANGLER_KV_ID }}'|" wrangler.toml
          sed -i '/^\[vars\]$/d' wrangler.toml
          sed -i '/^workers_dev = true$/a keep_vars = true' wrangler.toml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      # wrangler.toml deploys dist/index.js, while the workspace build writes the
      # current Worker bundle under packages/apps/workers/dist/index.js.
      - name: Prepare built Worker for deployment
        shell: bash
        run: cp packages/apps/workers/dist/index.js dist/index.js

      - name: Deploy chatbot Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: pnpm run wrangler deploy --config=wrangler.toml

      - name: Verify deployment
        shell: bash
        run: |
          if [ -z "${{ secrets.CF_WORKERS_DOMAIN }}" ]; then
            echo "::warning::CF_WORKERS_DOMAIN is not set"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 \
            "https://${{ secrets.CF_WORKERS_DOMAIN }}" >/dev/null
          echo "Chatbot health check passed."
